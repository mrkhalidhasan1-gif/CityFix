```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Issue | CivicConnect</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="navbar">
  <div class="container nav-inner">
    <a class="brand" href="/"><span class="brand-mark">✓</span>CivicConnect</a>
    <a href="/pages/dashboard.html">My Dashboard</a>
  </div>
</header>

<main class="auth-wrap">
  <form class="auth-card" id="reportForm" style="width:min(650px,100%)">
    <div class="eyebrow">NEW CIVIC REPORT</div>
    <h1>Report an issue</h1>

    <div class="form-group">
      <label>Issue title</label>
      <input class="form-control" id="title" placeholder="Example: Large pothole near market" required>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea id="description" placeholder="Describe the problem..." required></textarea>
    </div>

    <div class="form-group">
      <label>City</label>
      <input class="form-control" id="city" placeholder="Delhi" required>
    </div>

    <div class="form-group">
      <label>Address / Landmark</label>
      <input class="form-control" id="address" placeholder="Near metro station, market, etc.">
    </div>

    <div class="form-group">
      <label>Photo of the issue</label>
      <input class="form-control" id="image" type="file" accept="image/*">
      <small class="muted">Optional · Maximum 5 MB</small>
    </div>

    <img id="preview" style="display:none;width:100%;max-height:250px;object-fit:cover;border-radius:12px;margin-bottom:15px;">

    <button class="btn" type="submit">Submit Report</button>
  </form>
</main>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>

<script>
const user = civicAPI.requireLogin();
const imageInput = document.getElementById("image");
const preview = document.getElementById("preview");

imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];

  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {
    showToast("Photo must be smaller than 5 MB.", "error");
    imageInput.value = "";
    preview.style.display = "none";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
});

document.getElementById("reportForm").addEventListener("submit", async e => {
  e.preventDefault();

  const file = imageInput.files[0];
  let image = "";

  if (file) {
    image = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("Could not read photo."));
      reader.readAsDataURL(file);
    });
  }

  try {
    const data = await civicAPI.request("/issues", {
      method: "POST",
      body: JSON.stringify({
        title: document.getElementById("title").value.trim(),
        description: document.getElementById("description").value.trim(),
        city: document.getElementById("city").value.trim(),
        address: document.getElementById("address").value.trim(),
        image
      })
    });

    showToast(`Report submitted as ${data.issue.category}`);

    setTimeout(() => {
      window.location.href = "/pages/dashboard.html";
    }, 700);

  } catch (error) {
    showToast(error.message, "error");
  }
});
</script>

</body>
</html>
